name: Deploy

on:
  push:
    branches:
      - master

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'yarn'

      - name: Run install
        uses: borales/actions-yarn@v4
        with:
          cmd: install # will run `yarn install` command

      - name: convert excel to json
        uses: borales/actions-yarn@v4
        with:
          cmd: convert # will run `yarn convert` command

      # 字帖圖沒變時直接用上次轉好的 WebP，不必重轉
      - name: Cache webp images
        uses: actions/cache@v4
        with:
          path: |
            public/image
            public/thumb
          key: webp-${{ hashFiles('data/char-image/**', 'command/webp-images/**') }}

      - name: Build webp images
        uses: borales/actions-yarn@v4
        with:
          cmd: images # will run `yarn images` command

      - name: Build production bundle
        uses: borales/actions-yarn@v4
        with:
          cmd: build # will run `yarn build` command

      - name: Upload production-ready build files
        uses: actions/upload-artifact@v4
        with:
          name: production-files
          path: ./dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    permissions:
      contents: write # 允許推送到 gh-pages 分支

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: production-files
          path: ./dist

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
